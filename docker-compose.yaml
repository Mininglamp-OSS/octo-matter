services:
  todo-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: "dev"
      MYSQL_DSN: "todo:todo@tcp(mysql:3306)/octo_todo?charset=utf8mb4&parseTime=true"
      REDIS_URL: "redis://redis:6379/0"
      AUTH_URL: "http://octo-auth:8080"
      AUTH_INTERNAL_KEY: "${AUTH_INTERNAL_KEY:-dev-internal-key}"
      SERVER_PORT: "8080"
    depends_on:
      mysql:
        condition: service_healthy
      octo-auth:
        condition: service_started

  octo-auth:
    image: ghcr.io/Mininglamp-OSS/octo-auth:latest
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      REDIS_ADDR: "redis:6379"
      INTERNAL_KEY: "${AUTH_INTERNAL_KEY:-dev-internal-key}"
      KEY_DIR: "/data/keys"
      IM_REDIS_ADDR: "redis:6379"
      IM_TOKEN_PREFIX: "token:"
    volumes:
      - authkeys:/data/keys
    depends_on:
      - redis

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: octo_todo
      MYSQL_USER: todo
      MYSQL_PASSWORD: todo
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysqldata:/var/lib/mysql
      - ./migrations/001_init.up.sql:/docker-entrypoint-initdb.d/001_init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mysqldata:
  authkeys:
